name: Build for macOS

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'

      - name: Build macOS AMD64 binary
        run: |
          mkdir -p build
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 go build -o build/alicevszombies.darwin_amd64 -ldflags "-s -w"

      - name: Build macOS ARM64 binary
        run: |
          mkdir -p build
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -o build/alicevszombies.darwin_arm64 -ldflags "-s -w"

      - name: Upload macOS binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-binary
          path: build/*
